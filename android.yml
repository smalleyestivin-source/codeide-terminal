name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Copiar librerías locales (xterm y Pyodide)
        run: |
          mkdir -p www/vendor/pyodide
          cp node_modules/@xterm/xterm/lib/xterm.js node_modules/@xterm/xterm/css/xterm.css node_modules/@xterm/addon-fit/lib/addon-fit.js www/vendor/
          cp -r node_modules/pyodide/. www/vendor/pyodide/
          ls -la www/vendor www/vendor/pyodide
      - name: Generar www/index.html
        run: node scripts/build-www.js
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Guardar APK como archivo del build
        uses: actions/upload-artifact@v4
        with:
          name: codeide-terminal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-${{ github.run_number }}
          name: APK de prueba ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
